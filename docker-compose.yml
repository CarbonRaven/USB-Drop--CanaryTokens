services:
  # =============================================================================
  # Reverse Proxy - Caddy (automatic HTTPS)
  # =============================================================================
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      - TOKENS_BASIC_AUTH_USER=${TOKENS_BASIC_AUTH_USER:-admin}
      - TOKENS_BASIC_AUTH_HASH=${TOKENS_BASIC_AUTH_HASH}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
      - backend
      - canarytokens
    depends_on:
      - api
      - campaign-frontend
      - rickroll
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: usbdrop
      POSTGRES_USER: usbdrop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usbdrop"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # =============================================================================
  # Campaign API (FastAPI)
  # =============================================================================
  api:
    build:
      context: ./campaign-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://usbdrop:${DB_PASSWORD}@postgres:5432/usbdrop
      - CANARY_SERVER=http://canarytokens-frontend:8082
      - CANARY_DOMAIN=${CANARY_DOMAIN}
      - FACTORY_AUTH=${FACTORY_AUTH}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - IPINFO_TOKEN=${IPINFO_TOKEN}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      - SHLINK_URL=http://shlink:8080
      - SHLINK_API_KEY=${SHLINK_API_KEY}
      - SHLINK_DEFAULT_DOMAIN=${SHLINK_DOMAIN:-links.example.com}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CADDY_ADMIN_URL=http://caddy:2019
    volumes:
      - api_uploads:/app/uploads
      - ./Caddyfile:/app/Caddyfile
    networks:
      - frontend
      - backend
      - canarytokens
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Campaign Frontend (Vue 3)
  # =============================================================================
  campaign-frontend:
    build:
      context: ./campaign-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - frontend
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  # =============================================================================
  # RickRoll Landing Page
  # =============================================================================
  rickroll:
    build:
      context: ./landing-pages/rickroll
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DEFAULT_REDIRECT_URL=https://www.youtube.com/watch?v=dQw4w9WgXcQ
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  # =============================================================================
  # Shlink URL Shortener
  # =============================================================================
  shlink:
    image: shlinkio/shlink:4
    restart: unless-stopped
    environment:
      DEFAULT_DOMAIN: ${SHLINK_DOMAIN:-links.example.com}
      IS_HTTPS_ENABLED: "true"
      GEOLITE_LICENSE_KEY: ${GEOLITE_LICENSE_KEY:-}
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shlink
      DB_USER: shlink
      DB_PASSWORD: ${SHLINK_DB_PASSWORD}
      INITIAL_API_KEY: ${SHLINK_API_KEY}
      SKIP_INITIAL_GEOLITE_DOWNLOAD: "true"
      ANONYMIZE_REMOTE_ADDR: "false"
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  shlink-web:
    image: shlinkio/shlink-web-client:4
    restart: unless-stopped
    environment:
      SHLINK_SERVER_URL: https://${SHLINK_DOMAIN:-links.example.com}
      SHLINK_SERVER_API_KEY: ${SHLINK_API_KEY}
    networks:
      - frontend
    depends_on:
      - shlink
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  # =============================================================================
  # Redis (for CanaryTokens)
  # =============================================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - canarytokens
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

# =============================================================================
# Networks
# =============================================================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  canarytokens:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  api_uploads:
